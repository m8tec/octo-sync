name: Run tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore octo-sync.sln

      - name: Build
        run: dotnet build octo-sync.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/OctoSync.Tests/OctoSync.Tests.csproj --configuration Release --no-build --verbosity normal
